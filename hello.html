<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, GitHub Pages!</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;

      align-items: center;
      min-height: 100vh;

      background: #0d1117;

<body>
  <div class="card">
    <div class="rocket">🚀</div>

    <p>我的 AI 學習計劃，從這一頁開始。</p>

</html>
