<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集集鎮 · 旅遊地圖</title>

<!-- Leaflet 地圖函式庫（從 CDN 載入，開檔時需連網一次） -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- 中文字體：Noto Serif TC 當標題（檜木古樸感）、Noto Sans TC 當內文 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">

<style>
  /* ---------- 設計 token：集集鐵道小鎮的色盤 ----------
     檜木墨、山蕉黃、樟樹綠、磚紅，取自集集本身的地景 */
  :root{
    --ink:      #2b2119;   /* 檜木墨（主要文字） */
    --paper:    #f4ecd9;   /* 車票紙底 */
    --paper-2:  #ece0c6;   /* 次階紙色 */
    --banana:   #e6b31e;   /* 山蕉黃（主強調色） */
    --camphor:  #3f6b4a;   /* 樟樹綠（綠色隧道） */
    --brick:    #b0472e;   /* 磚紅（武昌宮／古蹟） */
    --line:     #c9b959;    /* 分隔線 */
    --muted:    #6f6250;   /* 次要文字 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Noto Sans TC",system-ui,sans-serif;
    color:var(--ink);
    background:var(--paper);
    /* 整體版面：左側點清單、右側地圖，各佔一半區塊 */
    display:grid;
    grid-template-columns:380px 1fr;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- 左側面板：仿集集線「時刻表／路線圖」 ---------- */
  #panel{
    background:var(--paper);
    border-right:2px solid var(--ink);
    overflow-y:auto;
    padding:0;
  }
  /* 車票式的標頭 */
  header{
    padding:22px 24px 18px;
    border-bottom:2px dashed var(--ink);   /* 虛線＝車票撕線 */
    background:
      repeating-linear-gradient(90deg,transparent 0 22px,rgba(43,33,25,.04) 22px 23px),
      var(--paper-2);
    position:sticky; top:0; z-index:5;
  }
  .eyebrow{
    font-size:12px; letter-spacing:.35em; color:var(--brick);
    font-weight:700; margin:0 0 6px;
  }
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:900; font-size:34px; margin:0; line-height:1;
    letter-spacing:.04em;
  }
  .sub{ margin:8px 0 0; font-size:13px; color:var(--muted); }

  /* 站點清單：左側一條垂直「路線」串起每一站 */
  ul#stops{ list-style:none; margin:0; padding:14px 0 40px; position:relative; }
  ul#stops::before{                       /* 貫穿的鐵道線 */
    content:""; position:absolute; left:47px; top:26px; bottom:52px;
    width:3px; background:var(--ink); opacity:.25;
  }
  li.stop{
    position:relative; padding:12px 22px 12px 70px;
    cursor:pointer; transition:background .15s;
  }
  li.stop:hover{ background:var(--paper-2); }
  li.stop.active{ background:#fff7e6; box-shadow:inset 4px 0 0 var(--banana); }

  /* 站號圓標（對應地圖上的編號） */
  .num{
    position:absolute; left:32px; top:14px;
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; color:#fff;
    border:2px solid var(--paper); box-shadow:0 0 0 2px var(--ink);
  }
  .stop h3{ margin:0; font-size:17px; font-family:"Noto Serif TC",serif; font-weight:700; }
  .meta{ margin:4px 0 0; font-size:12.5px; color:var(--muted); line-height:1.6; }
  .tags{ margin-top:7px; display:flex; gap:6px; flex-wrap:wrap; }
  .tag{
    font-size:11px; padding:2px 8px; border-radius:20px;
    border:1px solid currentColor; font-weight:500;
  }
  .tag.free{ color:var(--camphor); }
  .tag.paid{ color:var(--brick); }
  .tag.closed{ color:#8a6d1f; background:#fbf1d0; }

  /* ---------- 右側地圖 ---------- */
  #map{ height:100vh; }

  /* Leaflet 上的數字圖釘：用純 CSS 畫圓，不依賴外部圖片 */
  .pin{
    width:30px; height:30px; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center;
  }
  .pin span{ transform:rotate(45deg); color:#fff; font-weight:700; font-size:14px; }

  /* 資訊小卡（popup）樣式 */
  .leaflet-popup-content-wrapper{ border-radius:10px; }
  .pop h4{ margin:0 0 4px; font-family:"Noto Serif TC",serif; font-size:16px; }
  .pop p{ margin:2px 0; font-size:13px; color:#333; line-height:1.6; }
  .pop a{ color:var(--brick); font-weight:700; text-decoration:none; }

  /* ---------- 手機版：改為上下堆疊 ---------- */
  @media (max-width:760px){
    body{ grid-template-columns:1fr; grid-template-rows:46vh 54vh; }
    #panel{ border-right:none; border-bottom:2px solid var(--ink); }
    #map{ height:100%; }
    ul#stops::before{ display:none; }
  }
</style>
</head>
<body>

  <!-- 左側：站點清單 -->
  <nav id="panel">
    <header>
      <p class="eyebrow">南投 · 集集線</p>
      <h1>集集鎮旅遊地圖</h1>
      <p class="sub">鐵道 · 山蕉 · 綠色隧道 — 點選任一站，地圖為你導覽</p>
    </header>
    <ul id="stops"><!-- 由 JS 依資料自動生成 --></ul>
  </nav>

  <!-- 右側：地圖容器 -->
  <div id="map"></div>

<script>
/* =====================================================================
   1) 景點資料
   ---------------------------------------------------------------------
   每一筆是一個站點。把資料和畫面分開，之後要增刪景點只改這個陣列即可，
   下方的清單與圖釘都會自動跟著更新（資料驅動 UI 的基本原則）。
   欄位：座標、名稱、時間、票價、亮點說明、代表色、票價標籤類型。
   ===================================================================== */
const STOPS = [
  // ── 依動線重新排序（1=西端起點，沿民生路→集鹿路→民權路→民生東路→東昌巷→大坪巷→八張街→初中街系統→大樟樹，夜市收尾）──
  // 1
  { lat:23.830750,  lng:120.758347, name:"集集綠色隧道",
    time:"24 小時開放", fee:"免費",
    note:"4.5 公里老樟樹林蔭，騎鐵馬最愜意，偶爾與集集小火車相遇。",
    color:"#3f6b4a", feeType:"free" },

  // 2 集鹿路／攔河路（西南）
  { lat:23.8181906, lng:120.7633605, name:"台灣水資源館（集集攔河堰）",
    time:"09:00–17:00", fee:"免費",
    note:"集集攔河堰管理中心的水資源教育展館，有專人導覽，寓教於樂。全台最大攔河堰。",
    color:"#2f6d92", feeType:"free" },

  // 3 集鹿路
  { lat:23.8250743, lng:120.7839283, name:"漂流木花園餐廳",
    time:"10:00–21:00", fee:"入園免費・餐點另計",
    note:"集集市區的庭園景觀餐廳，自家種植蔬菜入菜，鬧中取靜的秘境小花園，近集集火車站。",
    color:"#8a6f4a", feeType:"free" },

  // 4 民生路
  { lat:23.826451,  lng:120.784890, name:"集集火車站",
    time:"全天（車站營運中）", fee:"免費",
    note:"1930 年純檜木車站，全鎮地標與租單車起點。旁邊就是集集老街，可順逛小吃。",
    color:"#b0472e", feeType:"free" },

  // 5 民權路
  { lat:23.827111,  lng:120.795420, name:"集集軍史公園",
    time:"24 小時開放", fee:"免費",
    note:"台灣首座退役軍武主題公園，展示戰機、戰車等除役裝備，軍事迷必訪。",
    color:"#5c6b3f", feeType:"free" },

  // 6 民生東路
  { lat:23.8286557, lng:120.7994486, name:"集集山蕉歷史文化館",
    time:"09:00–17:00", fee:"免費",
    note:"金蕉年代的香蕉主題文化館，展示集集山蕉歷史與在地農產，特生中心斜對面。週一公休。",
    color:"#caa03a", feeType:"free", closed:"週一公休" },

  // 7 民生東路
  { lat:23.828024,  lng:120.800516, name:"特有生物研究保育中心",
    time:"09:00–16:00", fee:"成人 60 / 學生 30",
    note:"台灣特有動植物展示、生命樹劇場，地下停車免費，親子必訪。週一公休。",
    color:"#2f6d78", feeType:"paid", closed:"週一公休" },

  // 8 東昌巷
  { lat:23.827527,  lng:120.799536, name:"明新書院",
    time:"06:30–18:00", fee:"免費",
    note:"清代三級古蹟，主祀文昌帝君，考生祈福熱點，安靜好拍。",
    color:"#a86a2c", feeType:"free" },

  // 9 民生東接大坪巷（最東）
  { lat:23.825082,  lng:120.814237, name:"集元果觀光工廠 Jijibanana",
    time:"09:00–17:30", fee:"免費入園",
    note:"香蕉主題觀光工廠，球池、溜滑梯、DIY，小孩放電首選。週三公休。",
    color:"#e6b31e", feeType:"free", closed:"週三公休" },

  // 10 文心街→右轉八張街
  { lat:23.830887,  lng:120.792145, name:"武昌宮（921 地震遺址）",
    time:"06:00–21:00", fee:"免費",
    note:"後方保留地震坍塌的舊廟，最具震撼與地震教育意義。",
    color:"#8a3b28", feeType:"free" },

  // 11 八張街（武昌宮旁）
  { lat:23.830780,  lng:120.792130, name:"浙江泰順廊橋",
    time:"24 小時開放", fee:"免費",
    note:"全台唯一跨河木造廊橋（浙江泰順縣所贈），就在武昌宮旁，橋中供奉月老可求姻緣。",
    color:"#a86a4a", feeType:"free" },

  // 12 橫山街→初中街→初中一街
  { lat:23.828775,  lng:120.780079, name:"集集大樟樹（樟樹公）",
    time:"24 小時開放", fee:"免費",
    note:"樹齡逾 700 年、高約 30 公尺的老樟樹，樹下有大眾爺祠。樹洞形似台灣，連年有領角鴞（貓頭鷹）築巢。",
    color:"#5c7a35", feeType:"free" },

  // 13 最後收尾
  { lat:23.828329,  lng:120.784536, name:"集集夜市",
    time:"週二・週六 晚間", fee:"免費",
    note:"就在車站旁，只有週二、週六營業，逛老街小吃順路收尾。",
    color:"#6b4b8a", feeType:"closed" },
];

/* =====================================================================
   2) 建立地圖
   ---------------------------------------------------------------------
   L.map() 初始化；setView 用第一個景點當中心。
   OpenStreetMap 圖磚免金鑰、免費，適合這種單機 HTML。
   ===================================================================== */
const map = L.map('map', { scrollWheelZoom:true })
             .setView([STOPS[0].lat, STOPS[0].lng], 14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  attribution:'&copy; OpenStreetMap 貢獻者'
}).addTo(map);

/* =====================================================================
   3) 依資料同時生成「地圖圖釘」與「左側清單」
   ---------------------------------------------------------------------
   一次迴圈把兩邊都建好，並用 markers[] 記住每個圖釘，
   讓清單點擊時能反向控制地圖。
   ===================================================================== */
const listEl  = document.getElementById('stops');
const markers = [];
const bounds  = [];   // 收集所有座標，最後讓地圖自動框住全部景點

STOPS.forEach((s, i) => {
  const no = i + 1;
  bounds.push([s.lat, s.lng]);

  /* --- 3a. 地圖圖釘：用 divIcon 畫一個帶編號的水滴圖釘 --- */
  const icon = L.divIcon({
    className:'',                         // 清掉預設樣式
    html:`<div class="pin" style="background:${s.color}"><span>${no}</span></div>`,
    iconSize:[30,30], iconAnchor:[15,30], popupAnchor:[0,-30]
  });

  const popupHtml = `
    <div class="pop">
      <h4>${no}. ${s.name}</h4>
      <p>🕒 ${s.time}${s.closed ? '　<b>'+s.closed+'</b>' : ''}</p>
      <p>🎟️ ${s.fee}</p>
      <p>${s.note}</p>
      <p><a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}"
            target="_blank" rel="noopener">在 Google 地圖開啟導航 ↗</a></p>
    </div>`;

  const marker = L.marker([s.lat, s.lng], { icon })
                  .addTo(map)
                  .bindPopup(popupHtml);
  markers.push(marker);

  /* --- 3b. 左側清單項目 --- */
  const feeTag = s.feeType === 'paid'
      ? '<span class="tag paid">需門票</span>'
      : s.feeType === 'closed'
        ? '<span class="tag closed">限特定日</span>'
        : '<span class="tag free">免費</span>';
  const closedTag = s.closed ? `<span class="tag closed">${s.closed}</span>` : '';

  const li = document.createElement('li');
  li.className = 'stop';
  li.innerHTML = `
    <div class="num" style="background:${s.color}">${no}</div>
    <h3>${s.name}</h3>
    <p class="meta">🕒 ${s.time}　🎟️ ${s.fee}</p>
    <p class="meta">${s.note}</p>
    <div class="tags">${feeTag}${closedTag}</div>`;

  /* 點清單 → 地圖飛過去並開啟該站資訊卡；同時高亮目前選中的項目 */
  li.addEventListener('click', () => {
    map.flyTo([s.lat, s.lng], 16, { duration:.8 });
    marker.openPopup();
    document.querySelectorAll('li.stop').forEach(el => el.classList.remove('active'));
    li.classList.add('active');
  });

  listEl.appendChild(li);
});

/* =====================================================================
   4) 建議動線：用虛線把各站依序連起來（西→東的一日遊路線）
   ===================================================================== */
L.polyline(bounds, {
  color:'#2b2119', weight:2, opacity:.35, dashArray:'2 8'
}).addTo(map);

/* 5) 開場時自動縮放到剛好框住所有景點，留一點邊距 */
map.fitBounds(bounds, { padding:[60,60] });
</script>
</body>
</html>
